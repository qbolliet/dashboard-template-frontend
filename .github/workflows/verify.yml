name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Le cache Next est invalidé par le lockfile (dépendances) et par le code
          # source (Turbopack en tient compte pour l'incrémentalité) ; une clé de repli
          # sans le hash du code permet de réutiliser un cache proche à défaut d'exact.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'config/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check palette sync
        run: npm run check:palette

      - name: Validate site config
        run: npm run validate:config

      - name: Check GraphQL documents
        run: npm run check:gql

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # =================================================================
  # E2E — Playwright sur Chromium
  # =================================================================
  # 1 worker (cf. playwright.config.ts : le globe WebGL rend en logiciel et affame le CPU).
  # La régression visuelle est écartée (E2E_SKIP_VISUAL) : les instantanés sont win32.
  # Le rapport HTML et les traces sont conservés même en cas d'échec.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SKIP_VISUAL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # =================================================================
  # EJECT — le dépôt reste éjectable
  # =================================================================
  # scripts/eject.js déplace des dossiers et remplace des chaînes EXACTES : c'est ce qui
  # le fait échouer bruyamment plutôt que de laisser passer un eject à moitié fait, mais
  # c'est aussi ce qui le fait pourrir au premier renommage. Ce job est la barrière.
  #
  # Deux étages, du moins cher au plus cher :
  #   • --dry-run, qui vérifie CHAQUE motif de remplacement sans rien écrire ;
  #   • l'eject réel dans une copie, suivi d'un build complet — la seule preuve que le
  #     résultat compile encore une fois la documentation retirée.
  eject:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ['', '--keep-docs']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dry run
        run: node scripts/eject.js ${{ matrix.mode }} --dry-run

      # Copie hors de l'arbre de travail : le script se supprime lui-même et réécrit
      # package.json, on ne veut pas de ça dans le dossier que les autres étapes lisent.
      - name: Eject a copy
        run: |
          cp -r . ../ejected
          cd ../ejected
          node scripts/eject.js ${{ matrix.mode }} --yes --force

      # `npm run verify` est la commande que le workflow du dépôt ÉJECTÉ exécutera (l'eject
      # le réécrit en ce sens) : la lancer ici prouve que ce workflow sera vert, lint,
      # tests, config, i18n strict et — en --keep-docs — générateurs compris.
      - name: Install, verify and build the ejected copy
        working-directory: ../ejected
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run build
